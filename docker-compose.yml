# ========================================================================
# Jarvis v6.0 — Production Docker Compose
# Services: jarvis-core, dockerproxy, ollama, redis, postgres, nginx
# Zero-Trust Ready | Isolated Networks | Health Monitoring
# ========================================================================

networks:
  jarvis-internal:
    driver: bridge
    internal: false  # Network for inter-container communication
  jarvis-db:
    driver: bridge
    internal: true   # Database network strictly isolated from internet

volumes:
  jarvis-workspace:
  jarvis-backups:
  jarvis-logs:
  jarvis-memory:
  ollama-models:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

services:
  # ── Docker Socket Proxy (O Guarda-Costas Zero-Trust) ───────────────────
  dockerproxy:
    image: tecnativa/docker-socket-proxy
    container_name: jarvis-docker-proxy
    hostname: dockerproxy
    restart: unless-stopped
    environment:
      # PERMISSÕES (O que o Jarvis PODE fazer no Sandbox)
      - CONTAINERS=1 # Pode criar e deletar contêineres
      - IMAGES=1     # Pode puxar imagens base (ex: python:alpine)
      - NETWORKS=1   # Pode conectar o sandbox em redes
      - POST=1       # Pode enviar comandos de estado (start/stop)
      # BLOQUEIOS (O que o Jarvis NÃO PODE fazer de jeito nenhum)
      - EXEC=0       # PROIBIDO invadir contêineres rodando
      - BUILD=0      # PROIBIDO compilar imagens na máquina host
      - VOLUMES=0    # PROIBIDO manipular discos do host
      - SECRETS=0    # PROIBIDO ler segredos do Docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Montagem Read-Only
    networks:
      - jarvis-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Jarvis Core Application ────────────────────────────────────────────
  jarvis-core:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: jarvis-core
    hostname: jarvis-core
    restart: unless-stopped
    ports:
      - "8765:8765"
      - "8000:8000"   # Prometheus metrics endpoint
    networks:
      - jarvis-internal
      - jarvis-db
    volumes:
      - jarvis-workspace:/app/workspace
      - jarvis-backups:/app/backups
      - jarvis-logs:/app/logs
      - jarvis-memory:/app/memory
      - ./.env:/app/.env:ro  # Read-only mount for security
    environment:
      - DISPLAY=:99
      - OLLAMA_HOST=http://ollama:11434
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://jarvis:jarvis_secure_2025@postgres:5432/jarvis_db
      - PYTHONUNBUFFERED=1
      - TZ=America/Sao_Paulo
      # NOVO: Obriga o Jarvis a usar o proxy em vez do root socket
      - DOCKER_HOST=tcp://dockerproxy:2375
    depends_on:
      dockerproxy:
        condition: service_started
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # ── Ollama (Local LLM Engine) ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: jarvis-ollama
    hostname: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    networks:
      - jarvis-internal
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_MAX_LOADED_MODELS=2
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Deploy de GPU comentado para evitar travamentos no Windows Desktop
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Redis (Cache + Rate Limiting) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    hostname: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - jarvis-internal
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ── PostgreSQL (Persistent Storage) ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jarvis-postgres
    hostname: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    networks:
      - jarvis-db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_DB=jarvis_db
      - POSTGRES_USER=jarvis
      - POSTGRES_PASSWORD=jarvis_secure_2025
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ── Jarvis Command Center UI (Flet Web) ────────────────────────────────
  jarvis-ui:
    image: python:3.11-slim
    container_name: jarvis-ui
    hostname: jarvis-ui
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install flet aiohttp requests --quiet &&
             python ui/app.py"
    ports:
      - "8501:8501"
    networks:
      - jarvis-internal
    volumes:
      - .:/app:ro
      - jarvis-workspace:/app/workspace:ro
    environment:
      - JARVIS_API_URL=http://jarvis-core:8765
      - GRAFANA_URL=http://localhost:3000
      - JARVIS_UI_TOKEN=${JARVIS_UI_TOKEN:-}
      - WORKSPACE_PATH=/app/workspace
    depends_on:
      jarvis-core:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ── Prometheus (Metrics Scraper) ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: jarvis-prometheus
    hostname: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - jarvis-internal
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    depends_on:
      - jarvis-core
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ── Grafana (Observability Dashboard) ─────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: jarvis-grafana
    hostname: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - jarvis-internal
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=jarvis_grafana_2025
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── NGINX (Reverse Proxy + TLS Termination) ───────────────────────────
  nginx:
    image: nginx:alpine
    container_name: jarvis-nginx
    hostname: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - jarvis-internal
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - jarvis-core
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M